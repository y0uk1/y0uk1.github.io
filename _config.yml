# Theme files are vendored unchanged from yaoyao-liu/minimal-light.
markdown: kramdown
plugins:
  - jekyll-redirect-from

# Preserve the old source material without publishing the previous multi-page site.
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - LICENSE-minimal-light
  - CHANGELOG.md
  - CONTRIBUTING.md
  - package.json
  - node_modules
  - vendor
  - .sass-cache
  - _pages
  - _posts
  - _drafts
  - _portfolio
  - _publications
  - _teaching
  - _talks
  - markdown_generator
  - talkmap
  - talkmap.py
  - talkmap.ipynb
  - assets/css/main.scss
